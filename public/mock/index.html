<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gokon planner mock</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
      .container { width: min(960px, 92vw); margin: 24px auto; }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
      h1, h2 { margin-top: 0; }
      .muted { color: #475569; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>gokon planner（静的モック）</h1>
      <p class="muted">GitHub Pages確認用。実アプリはNext.js環境で動作します。</p>

      <div class="card">
        <h2>募集一覧（例）</h2>
        <p>案件 #1024 / 渋谷 / 10-05 19:00 / 不足: 女性2</p>
        <p>案件 #1023 / 新宿 / 10-06 18:30 / 不足: 男性1</p>
      </div>

      <div class="card">
        <h2>募集作成（例）</h2>
        <p>タイトル、日時、エリア、予算、不足枠、年齢帯、所属カテゴリ</p>
      </div>

      <div class="card">
        <h2>応募（例）</h2>
        <p>提供可能枠、年齢帯構成、所属構成、連絡可能時間</p>
      </div>
    </div>
  </body>
</html>
